name: API checks and deploy
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: santa
          POSTGRES_PASSWORD: santa-ci-only
          POSTGRES_DB: santa
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U santa" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://santa:santa-ci-only@127.0.0.1:5432/santa
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            infra/package-lock.json
      - run: npm ci
      - run: npm ci --prefix infra
      - run: npm test
      - run: npm --prefix infra test
      - run: docker build --tag santa-api:test .
  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: api-production
      cancel-in-progress: false
    env:
      AWS_REGION: us-east-1
      HOSTED_ZONE_ID: ${{ vars.AWS_HOSTED_ZONE_ID || 'Z048991646CTHOIEUNBC' }}
      CLOUDFRONT_PREFIX_LIST_ID: ${{ vars.AWS_CLOUDFRONT_PREFIX_LIST_ID || 'pl-3b927c52' }}
      SITE_URL: ${{ vars.SITE_URL || 'https://guesswhossanta.com' }}
    steps:
      - uses: actions/checkout@v4
      - name: Skip superseded revisions
        id: revision
        run: |
          latest="$(git ls-remote --exit-code origin refs/heads/main | cut -f1)"
          if [ "$latest" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "A newer main revision exists; skipping this deployment."
          fi
      - uses: actions/setup-node@v4
        if: steps.revision.outputs.current == 'true'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: infra/package-lock.json
      - uses: docker/setup-qemu-action@v3
        if: steps.revision.outputs.current == 'true'
        with:
          platforms: arm64
      - uses: aws-actions/configure-aws-credentials@v4
        if: steps.revision.outputs.current == 'true'
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN || 'arn:aws:iam::494191147683:role/GuessWhosSanta-GitHubApiDeployEF1CEE28-qn2fyyYH25Ju' }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Check sign-in email readiness
        if: steps.revision.outputs.current == 'true'
        run: |
          if [ "$(aws secretsmanager describe-secret --region us-east-2 \
            --secret-id guesswhossanta/sendgrid-api-key \
            --query 'length(VersionIdsToStages.*[?contains(@, `AWSCURRENT`)][])' --output text)" != "1" ]; then
            echo "::error::The SendGrid secret must have a current version before deploying the account-required API."
            exit 1
          fi
      - name: Deploy API and infrastructure
        if: steps.revision.outputs.current == 'true'
        run: |
          : "${HOSTED_ZONE_ID:?Set the AWS_HOSTED_ZONE_ID repository variable}"
          : "${CLOUDFRONT_PREFIX_LIST_ID:?Set the AWS_CLOUDFRONT_PREFIX_LIST_ID repository variable}"
          : "${SITE_URL:?Set the SITE_URL repository variable}"
          npm ci --prefix infra
          npm --prefix infra run deploy -- GuessWhosSanta --ci --require-approval never \
            --parameters "HostedZoneId=$HOSTED_ZONE_ID" \
            --parameters "CloudFrontPrefixListId=$CLOUDFRONT_PREFIX_LIST_ID"
          curl --fail --silent --show-error --max-time 20 --retry 10 --retry-delay 10 --retry-all-errors "$SITE_URL/api/auth/session" \
            | node --input-type=module -e '
              let body = ""; for await (const chunk of process.stdin) body += chunk;
              const state = JSON.parse(body);
              if (state.user !== null || !Array.isArray(state.parties)) throw new Error("The deployed account API did not return the expected session response");
            '
